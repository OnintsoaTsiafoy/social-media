name: hootly

services:
  postgres:
    image: hootly-postgres-vector:16
    build:
      context: ./services/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      SOCIAL_SERVICE_URL: ${SOCIAL_SERVICE_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.86}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      # Console web d'administration servie depuis une autre origine (facultatif).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Retour de Facebook vers la console quand un administrateur y connecte une page.
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-http://localhost:5173}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS}
      # Sprint 11: NotificationPushService (services/api/src/lib/firebase.js)
      # only initialises Firebase Admin when all three are set — the API
      # starts and stays healthy without them, push is just a no-op.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      # Sprint 07: the worker calls graph-api directly to deliver a
      # publication (docs/DECISIONS_ARCHITECTURE.md's Worker --> Social
      # edge), and signs the publication's media so graph-api can fetch it.
      SOCIAL_SERVICE_URL: ${SOCIAL_SERVICE_URL}
      SOCIAL_PROVIDER_MODE: ${SOCIAL_PROVIDER_MODE}
      # Sprint 09: the worker sweeps unanalysed comments and calls the AI
      # service directly, the same way it already calls graph-api.
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      # Sprint 11 Jour 3: Firebase Admin ne vit que dans Express (Jour 2) — le
      # worker lui demande de créer/pousser une notification via
      # /internal/v1/notifications (voir src/notifications-client.js).
      # Best-effort : jamais requis par /ready, un envoi raté ne doit jamais
      # faire échouer l'analyse/la publication/le rafraîchissement eux-mêmes.
      API_SERVICE_URL: ${API_SERVICE_URL}
    # Publié pour que `scripts/verify-readiness.ps1` interroge la sonde du worker.
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  graph-api:
    build:
      context: ./graph-api
    environment:
      GRAPH_API_BASE_URL: https://graph.facebook.com/v25.0
      # Previously missing: without these, /ready always reported
      # meta_configuration_missing under Compose regardless of the values in
      # graph-api/.env (fixed alongside the Sprint 05 JWT wiring below).
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      # Sprint 07: Instagram Login (direct, no Facebook Page) — a separate
      # Meta API product from the Facebook app above, its own credentials.
      # Previously missing here entirely: the code/tests were complete but
      # no deployment could ever configure this path (found via live E2E
      # testing, not caught by pytest, which sets these directly in-process).
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      # Sprint 08: Meta webhook subscription challenge secret (hub.verify_token)
      # — wired here from day one this time (see the two comments above for
      # what happens when a new Meta credential is forgotten from Compose).
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      PUBLIC_BASE_URL: ${SOCIAL_SERVICE_PUBLIC_URL}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      # Sprint 06: graph-api's own connection for social_accounts/oauth_tokens/
      # social_permissions/oauth_states/service_idempotency_keys (raw SQL —
      # Prisma still owns the migration, see services/api/prisma/schema.prisma).
      DATABASE_URL: ${DATABASE_URL}
      TOKEN_ENCRYPTION_KEY_CURRENT_VERSION: ${TOKEN_ENCRYPTION_KEY_CURRENT_VERSION}
      TOKEN_ENCRYPTION_KEY_1: ${TOKEN_ENCRYPTION_KEY_1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ./services/ai-service
    environment:
      PORT: 8080
      # Sprint 09: `local` = the scikit-learn models trained at image build
      # time from services/ai-service/dataset/. This replaces the Sprint 01
      # placeholder value `stub`, which no longer corresponds to any code path.
      AI_MODEL_MODE: local
      # Sprint 10: `local` (default) generates replies from the brand settings
      # with no network call and no key. `llm` routes generation through Claude
      # when ANTHROPIC_API_KEY is set, and falls back to the local generator
      # whenever the model is unavailable — the service never stops working
      # for want of a key.
      AI_GENERATION_MODE: ${AI_GENERATION_MODE}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FASTEMBED_CACHE_PATH: /models
      # Same shared secret as graph-api, different audience: ai-service only
      # accepts tokens minted for it (see its core/security.py).
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - embedding_models:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  embedding_models:
  postgres_data:
  minio_data:

openapi: 3.1.0
info:
  title: Hootly Social Internal API
  version: 0.4.0
  description: >
    Contrat interne, protégé par un JWT de service depuis le Sprint 05.
    Implémenté par graph-api sous /internal/v1 (voir
    api/routes/internal_routes.py, oauth_routes.py, social_account_routes.py,
    webhook_routes.py). Sprint 05 : provider "facebook" uniquement, résolu
    via la Page unique configurée en local. Sprint 06 : résolution par
    socialAccountId, OAuth Meta et gestion des comptes connectés. Sprint 07 :
    provider "instagram", doubles parcours OAuth (Page liée ou Instagram
    Login direct). Sprint 08 : webhooks Meta (/webhooks/meta, public, en
    dehors de ce contrat de service JWT), persistance des commentaires et
    réponses idempotentes par commentaire.
paths:
  /webhooks/meta:
    get:
      summary: Challenge d'abonnement webhook Meta (public, Sprint 08)
      description: >
        Appelé directement par le Dashboard Meta App, pas par nos services —
        aucun JWT de service. Répond hub.challenge en texte brut si
        hub.verify_token correspond à META_WEBHOOK_VERIFY_TOKEN.
      parameters:
        - in: query
          name: hub.mode
          schema: { type: string }
        - in: query
          name: hub.verify_token
          schema: { type: string }
        - in: query
          name: hub.challenge
          schema: { type: string }
      responses:
        '200': { description: hub.challenge renvoyé tel quel, text/plain }
        '403': { description: hub.verify_token absent ou incorrect }
    post:
      summary: Livraison d'événements webhook Meta (public, Sprint 08)
      description: >
        Vérifié par X-Hub-Signature-256 (HMAC-SHA256 du corps brut), pas un
        JWT de service — le secret utilisé dépend du champ "object" du
        payload ("page" → FACEBOOK_APP_SECRET, "instagram" →
        INSTAGRAM_APP_SECRET). Toujours 200 une fois la signature validée,
        même si certains événements individuels échouent au traitement
        (chacun a son propre webhook_events ; Meta redélivre agressivement
        sur tout non-200). Dédupliqué par (provider, hash du "change"
        individuel) — un même événement redélivré ne crée jamais deux
        commentaires.
      parameters:
        - in: header
          name: X-Hub-Signature-256
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Format Meta natif (object/entry/changes), non enveloppé" }
      responses:
        '200': { description: Signature valide, événements traités (voir webhook_events pour le détail) }
        '400': { description: Corps JSON invalide }
        '403': { description: "object inconnu ou signature invalide" }
  /internal/v1/oauth/{provider}/authorization-url:
    post:
      summary: Démarrer une connexion OAuth (Sprint 06/07)
      security: [{ serviceJwt: [] }]
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [facebook, instagram] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationUrlRequest' }
      responses:
        '200':
          description: URL du dialogue Meta et state à usage unique
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationUrlResponse' }
        '401': { description: JWT de service absent, invalide ou expiré }
        '403': { description: Scope social:write manquant }
  /oauth/facebook/callback:
    get:
      summary: Callback OAuth Facebook (public, protégé par le state)
      description: >
        Appelé directement par Meta comme redirection navigateur — pas de
        JWT de service ici. Consomme le state à usage unique, échange le
        code, découvre les Pages éligibles et leur compte Instagram lié.
      parameters:
        - in: query
          name: code
          schema: { type: string, nullable: true }
        - in: query
          name: state
          schema: { type: string, nullable: true }
        - in: query
          name: error
          schema: { type: string, nullable: true }
      responses:
        '302': { description: Redirection vers le deep link mobile (status/network/account/reason) }
  /oauth/instagram/callback:
    get:
      summary: Callback Instagram Login direct, sans Page (public, Sprint 07)
      parameters:
        - in: query
          name: code
          schema: { type: string, nullable: true }
        - in: query
          name: state
          schema: { type: string, nullable: true }
        - in: query
          name: error
          schema: { type: string, nullable: true }
      responses:
        '302': { description: Redirection vers le deep link mobile (status/network/account/reason) }
  /internal/v1/social-accounts/{socialAccountId}/profile:
    get:
      summary: Relit et persiste name/username/avatarUrl depuis Meta (Sprint 06)
      security: [{ serviceJwt: [] }]
      parameters:
        - in: path
          name: socialAccountId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Profil actualisé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '401': { description: JWT de service absent, invalide ou expiré }
        '403': { description: Scope social:read manquant }
        '404': { description: Compte social introuvable }
        '409': { description: Token invalide côté Meta ; reconnexion requise (voir ErrorEnvelope) }
  /internal/v1/social-accounts/{socialAccountId}/refresh-token:
    post:
      summary: Revalide (Page) ou tourne (Instagram Login) le token (Sprint 06/07)
      security: [{ serviceJwt: [] }]
      parameters:
        - in: path
          name: socialAccountId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Token toujours valide, ou rotation réussie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshTokenResponse' }
        '401': { description: JWT de service absent, invalide ou expiré }
        '403': { description: Scope social:write manquant }
        '404': { description: Compte social introuvable }
        '409': { description: Token invalide côté Meta ; reconnexion requise (voir ErrorEnvelope) }
  /internal/v1/social-accounts/{socialAccountId}/permissions:
    get:
      summary: Permissions Meta connues pour ce compte (Sprint 06)
      security: [{ serviceJwt: [] }]
      parameters:
        - in: path
          name: socialAccountId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Permissions accordées et manquantes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionsResponse' }
        '401': { description: JWT de service absent, invalide ou expiré }
        '403': { description: Scope social:read manquant }
        '404': { description: Compte social introuvable }
  /internal/v1/social-accounts/{socialAccountId}/revoke:
    post:
      summary: Déconnecte localement le compte (Sprint 06)
      description: >
        Local uniquement — ne révoque pas l'autorisation côté Meta (voir
        docs/SPRINT_06_OAUTH_MULTI_COMPTES_TOKENS.md, section Décisions Meta).
      security: [{ serviceJwt: [] }]
      parameters:
        - in: path
          name: socialAccountId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Compte déconnecté côté Hootly
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeResponse' }
        '401': { description: JWT de service absent, invalide ou expiré }
        '403': { description: Scope social:write manquant }
        '404': { description: Compte social introuvable }
  /internal/v1/competitors/profile:
    post:
      summary: Informations publiques accessibles d'un concurrent (analyse concurrentielle)
      description: >
        Résout et lit un concurrent au nom du compte social de la marque.
        Facebook : lecture de la Page via Page Public Content Access. Instagram :
        Business Discovery, la requête partant toujours du compte Instagram de
        la marque.

        Répond 200 MÊME QUAND META REFUSE : le refus est porté par `status`
        (ACTIVE / UNAVAILABLE / PERMISSION_REQUIRED / SYNC_ERROR), parce que
        c'est un fait que l'appelant doit persister, pas une panne à retenter
        en boucle. Seules les erreurs d'infrastructure restent des erreurs HTTP.
      security: [{ serviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [socialAccountId, platform, handle]
              properties:
                socialAccountId: { type: string, format: uuid }
                platform: { type: string, enum: [FACEBOOK, INSTAGRAM] }
                handle:
                  type: string
                  description: Nom d'utilisateur, identifiant numérique ou nom de vanité de Page.
      responses:
        '200':
          description: Profil, ou refus classé
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ACTIVE, UNAVAILABLE, PERMISSION_REQUIRED, SYNC_ERROR] }
                  externalId: { type: [string, 'null'] }
                  username: { type: [string, 'null'] }
                  name: { type: [string, 'null'] }
                  profileUrl: { type: [string, 'null'] }
                  avatarUrl: { type: [string, 'null'] }
                  accountType: { type: [string, 'null'] }
                  followersCount: { type: [integer, 'null'] }
                  postsCount: { type: [integer, 'null'] }
                  unavailableFields:
                    type: array
                    items: { type: string }
                    description: Champs demandés que Meta n'a pas rendus, nommés un par un.
                  errorCode: { type: [string, 'null'] }
                  errorMessage: { type: [string, 'null'] }
        '403': { description: Scope social:read absent }
        '404': { description: Compte social introuvable }
        '409': { description: Aucun token actif pour ce compte (TOKEN_EXPIRED) }
        '422': { description: Réseau non pris en charge }

  /internal/v1/competitors/posts:
    post:
      summary: Publications publiques accessibles d'un concurrent, paginées par curseur
      description: >
        Parcourt jusqu'à `maxPages` pages. Un refus survenu APRÈS une première
        page réussie ne jette pas ce qui a déjà été lu : les publications
        collectées sont renvoyées avec le statut du refus.
      security: [{ serviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [socialAccountId, platform, handle]
              properties:
                socialAccountId: { type: string, format: uuid }
                platform: { type: string, enum: [FACEBOOK, INSTAGRAM] }
                handle: { type: string }
                limit: { type: integer, default: 25 }
                cursor: { type: [string, 'null'] }
                maxPages: { type: integer, default: 4 }
      responses:
        '200':
          description: Publications, curseur suivant et refus éventuel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ACTIVE, UNAVAILABLE, PERMISSION_REQUIRED, SYNC_ERROR] }
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        externalPostId: { type: string }
                        message: { type: [string, 'null'] }
                        mediaType: { type: [string, 'null'] }
                        permalink: { type: [string, 'null'] }
                        publishedAt: { type: [string, 'null'] }
                        reactionsCount: { type: [integer, 'null'] }
                        commentsCount: { type: [integer, 'null'] }
                        sharesCount:
                          type: [integer, 'null']
                          description: Toujours null sur Instagram — Business Discovery n'expose pas les partages.
                  nextCursor: { type: [string, 'null'] }
                  hasMore: { type: boolean }
                  unavailableFields: { type: array, items: { type: string } }
                  errorCode: { type: [string, 'null'] }
                  errorMessage: { type: [string, 'null'] }

  /internal/v1/accounts/audience:
    post:
      summary: Audience du compte de la marque lui-même (analyse concurrentielle)
      description: >
        Pas un concurrent : le compte administré par l'application, lu sans PPCA
        ni Business Discovery. Relevé dans la même passe pour que le taux
        d'engagement de la marque et celui d'un concurrent soient calculés de la
        même façon — sans quoi la comparaison resterait « non disponible ».
      security: [{ serviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [socialAccountId]
              properties:
                socialAccountId: { type: string, format: uuid }
      responses:
        '200':
          description: Abonnés et nombre de publications, quand Meta les expose
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  followersCount: { type: [integer, 'null'] }
                  postsCount: { type: [integer, 'null'] }
                  errorCode: { type: [string, 'null'] }
                  errorMessage: { type: [string, 'null'] }

  /health:
    get:
      responses: { '200': { description: Processus actif } }
  /ready:
    get:
      responses:
        '200': { description: Configuration Meta complète }
        '503': { description: Configuration Meta absente ou invalide }
  /internal/v1/publications/publish:
    post:
      summary: Publier une commande vers une ou plusieurs cibles
      security: [{ serviceJwt: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '200':
          description: Un résultat par cible (succès ou échec individuel — voir errorCode)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishResponse' }
        '400': { description: En-tête Idempotency-Key manquant, voir ErrorEnvelope }
        '401': { description: JWT de service absent, invalide ou expiré }
        '403': { description: Scope social:write manquant }
  /internal/v1/comments/sync:
    post:
      summary: Synchroniser (et persister) les commentaires d'un ou plusieurs posts
      description: >
        Sprint 08 : marche désormais tous les posts listés en interne, page
        par page (plafonné par un réglage serveur), et persiste chaque
        commentaire au fil de l'eau plutôt que de renvoyer une seule page au
        choix de l'appelant — voir CommentsSyncRequest, qui n'a donc plus ni
        since ni cursor (aucun des deux fils de commentaires Meta ne
        supporte un filtre par date). Met aussi à jour
        social_accounts.lastCommentsSyncAt pour un socialAccountId résolu.
      security: [{ serviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentsSyncRequest' }
      responses:
        '200':
          description: Commentaires normalisés (déjà persistés)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentsSyncResponse' }
        '401': { description: JWT de service absent, invalide ou expiré }
        '403': { description: Scope social:read manquant }
  /internal/v1/comments/reply:
    post:
      summary: Répondre à un commentaire (Sprint 08 — clé sur l'id de commentaire Hootly)
      description: >
        Résout le compte social et l'id de commentaire externe depuis
        social_comments (CommentsReplyRequest ne prend plus provider/
        socialAccountId/externalCommentId séparément — rien avant ce sprint
        n'avait de ligne à résoudre). Réclame une ligne sent_responses avant
        l'appel Meta (409 si déjà envoyée avec succès ou en cours ; un échec
        précédent peut être retenté) et fait passer le commentaire à
        PROCESSED en cas de succès.
      security: [{ serviceJwt: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentsReplyRequest' }
      responses:
        '200':
          description: Réponse envoyée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentsReplyResponse' }
        '400': { description: En-tête Idempotency-Key manquant }
        '401': { description: JWT de service absent, invalide ou expiré }
        '403': { description: Scope social:write manquant }
        '404': { description: Commentaire introuvable }
        '409': { description: "Déjà envoyée, envoi en cours, ou commentaire supprimé sur la plateforme" }
  /internal/v1/metrics/sync:
    post:
      summary: Synchroniser les métriques disponibles (null si indisponible)
      security: [{ serviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricsSyncRequest' }
      responses:
        '200':
          description: Métriques collectées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSyncResponse' }
        '401': { description: JWT de service absent, invalide ou expiré }
        '403': { description: Scope social:read manquant }
components:
  securitySchemes:
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Claims attendus : {sub, aud:"social-service", scope:["social:read"|"social:write"],
        type:"service", jti, exp}. Un JWT utilisateur (mobile) est toujours refusé (401).
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            requestId: { type: string, nullable: true }
    PublishTarget:
      type: object
      required: [publicationTargetId, provider, content]
      properties:
        publicationTargetId: { type: string, format: uuid }
        socialAccountId: { type: string, format: uuid, nullable: true }
        provider: { type: string, enum: [facebook] }
        content: { type: string }
        mediaUrls:
          type: array
          items: { type: string, format: uri }
          description: Images uniquement à ce sprint ; vidéo par URL non supportée.
    PublishRequest:
      type: object
      required: [publicationId, targets]
      properties:
        publicationId: { type: string, format: uuid }
        targets:
          type: array
          items: { $ref: '#/components/schemas/PublishTarget' }
    PublishTargetResult:
      type: object
      properties:
        provider: { type: string }
        status: { type: string, enum: [SUCCESS, FAILED] }
        externalPublicationId: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
    PublishResponse:
      type: object
      properties:
        publicationId: { type: string, format: uuid }
        results:
          type: array
          items: { $ref: '#/components/schemas/PublishTargetResult' }
    CommentsSyncRequest:
      type: object
      required: [provider]
      properties:
        socialAccountId: { type: string, format: uuid, nullable: true }
        provider: { type: string, enum: [facebook, instagram] }
        publicationExternalIds:
          type: array
          items: { type: string }
        limit:
          type: integer
          default: 100
          description: Taille de page par appel Meta interne, pas une limite sur le total renvoyé.
    CommentSyncItem:
      type: object
      properties:
        externalCommentId: { type: string }
        externalPublicationId: { type: string }
        authorExternalId: { type: string, nullable: true }
        authorName: { type: string, nullable: true }
        content: { type: string, nullable: true }
        createdAt: { type: string, nullable: true }
        updatedAt: { type: string, nullable: true }
        isDeleted: { type: boolean, default: false }
    CommentsSyncResponse:
      type: object
      properties:
        comments:
          type: array
          items: { $ref: '#/components/schemas/CommentSyncItem' }
    CommentsReplyRequest:
      type: object
      required: [commentId, userId, text]
      properties:
        commentId: { type: string, format: uuid, description: Id social_comments Hootly, pas l'id externe Meta. }
        userId: { type: string, format: uuid, description: À qui attribuer la réponse et le changement de statut. }
        text: { type: string, minLength: 1 }
    CommentsReplyResponse:
      type: object
      properties:
        status: { type: string, enum: [SUCCESS] }
        externalReplyId: { type: string, nullable: true }
        sentAt: { type: string, nullable: true }
    MetricsSyncRequest:
      type: object
      required: [provider]
      properties:
        socialAccountId: { type: string, format: uuid, nullable: true }
        provider: { type: string, enum: [facebook] }
        publicationExternalIds:
          type: array
          items: { type: string }
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
    MetricItem:
      type: object
      description: Un champ absent/null signifie "indisponible", jamais un zéro implicite.
      properties:
        externalPublicationId: { type: string }
        collectedAt: { type: string }
        reactions: { type: integer, nullable: true }
        comments: { type: integer, nullable: true }
        shares: { type: integer, nullable: true }
        reach: { type: integer, nullable: true }
        impressions: { type: integer, nullable: true }
    MetricsSyncResponse:
      type: object
      properties:
        metrics:
          type: array
          items: { $ref: '#/components/schemas/MetricItem' }
    AuthorizationUrlRequest:
      type: object
      required: [userId, brandId, mobileRedirectUri]
      properties:
        userId: { type: string, format: uuid }
        brandId: { type: string, format: uuid }
        mobileRedirectUri: { type: string, format: uri }
    AuthorizationUrlResponse:
      type: object
      properties:
        authorizationUrl: { type: string, format: uri }
        state: { type: string }
        expiresAt: { type: string, format: date-time }
    ProfileResponse:
      type: object
      properties:
        socialAccountId: { type: string, format: uuid }
        name: { type: string }
        username: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
    RefreshTokenResponse:
      type: object
      properties:
        socialAccountId: { type: string, format: uuid }
        status: { type: string, enum: [CONNECTED, EXPIRING, EXPIRED, REAUTH_REQUIRED, REVOKED, DISCONNECTED] }
        expiresAt: { type: string, format: date-time, nullable: true }
        refreshed: { type: boolean }
    PermissionsResponse:
      type: object
      properties:
        permissions:
          type: array
          items: { type: string }
        missingRequiredPermissions:
          type: array
          items: { type: string }
    RevokeResponse:
      type: object
      properties:
        status: { type: string, enum: [DISCONNECTED] }

openapi: 3.1.0
info:
  title: Hootly Public API
  version: 0.6.0
  description: >
    Contrat public Hootly. Authentification (Sprint 02), profil et marques
    (Sprint 03), publications, médias, planification et calendrier (Sprint 04),
    comptes sociaux et OAuth Meta (Sprint 06/07), commentaires et réponses
    contrôlées (Sprint 08), analyse de sentiment (Sprint 09), propositions de
    réponse et hashtags (Sprint 10), notifications et Firebase Cloud
    Messaging (Sprint 11).
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Processus actif
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200': { description: Dépendances configurées }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/register:
    post:
      summary: Créer un compte utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login:
    post:
      summary: Ouvrir une session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/refresh:
    post:
      summary: Faire tourner le refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/auth/logout:
    post:
      summary: Révoquer la session courante
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session révoquée }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/auth/me:
    get:
      summary: Retourner l'utilisateur et sa marque active
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/CurrentUser' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/auth/forgot-password:
    post:
      summary: Demander un lien de réinitialisation sans révéler l’existence du compte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202': { description: Demande acceptée, réponse identique pour toute adresse }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/reset-password:
    post:
      summary: Utiliser une fois un token de réinitialisation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Mot de passe réinitialisé et sessions révoquées }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/auth/change-password:
    post:
      summary: Modifier le mot de passe de l’utilisateur connecté
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/auth/sessions:
    get:
      summary: Lister les sessions actives de l’utilisateur connecté
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SessionList' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
    delete:
      summary: Fermer toutes les sessions, y compris la session courante
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Toutes les sessions ont été révoquées }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/auth/sessions/{id}:
    delete:
      summary: Fermer une session précise (jamais la courante depuis l’écran mobile)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Session révoquée }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/account:
    delete:
      summary: Supprimer (désactiver) le compte de l’utilisateur connecté
      description: >
        Vérifie le mot de passe, annule les publications planifiées et
        déconnecte les comptes sociaux des marques possédées sans autre
        membre actif, puis désactive le compte et révoque ses sessions. Refusée
        si une marque possédée a encore d’autres membres actifs : il faut
        d’abord les transférer ou les retirer.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: Compte désactivé et sessions révoquées }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/profile:
    get:
      summary: Lire le profil de l’utilisateur connectÃ©
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
    patch:
      summary: Modifier le profil de l’utilisateur connectÃ©
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfilePatch' } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/profile/preferences:
    get:
      summary: Lire les prÃ©fÃ©rences du profil
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      summary: Modifier les prÃ©fÃ©rences du profil
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreferencesPatch' } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/profile/avatar:
    post:
      summary: Associer un avatar prÃ©alablement dÃ©posÃ© au profil
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AvatarMetadata' } } }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      summary: Retirer l’avatar du profil
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Avatar retirÃ© } }
  /api/v1/brands:
    get:
      summary: Lister les marques auxquelles l’utilisateur appartient
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: active, in: query, schema: { type: boolean } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      summary: CrÃ©er une marque et l’activer pour son propriÃ©taire
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BrandCreate' } } }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/brands/{brandId}:
    parameters:
      - { name: brandId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Lire une marque autorisÃ©e
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Modifier une marque (OWNER ou ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BrandPatch' } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Archiver une marque (OWNER uniquement)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Marque archivÃ©e }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/brands/{brandId}/activate:
    post:
      summary: DÃ©finir la marque active de l’utilisateur connectÃ©
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/brands/{brandId}/ai-settings:
    parameters:
      - { name: brandId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Lire les paramÃ¨tres IA de la marque
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      summary: CrÃ©er une nouvelle version des paramÃ¨tres IA (OWNER ou ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AiSettingsPatch' } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/media:
    post:
      summary: Déposer une image (JPEG, PNG ou WebP)
      description: >
        Envoi multipart. Le type réel est déduit des octets, jamais du nom de
        fichier. Le média reste TEMPORARY tant qu'il n'est pas rattaché à une
        publication, puis il est déplacé vers la clé définitive.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                brandId: { type: string, format: uuid }
                purpose: { type: string, enum: [publication, avatar], default: publication }
      responses:
        '201': { $ref: '#/components/responses/Media' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/MediaTooLarge' }
        '415': { $ref: '#/components/responses/MediaTypeNotAllowed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/media/{mediaId}:
    parameters:
      - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Métadonnées et URL de lecture signée
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Supprimer un média non utilisé
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Média supprimé }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/publications:
    get:
      summary: Lister les publications accessibles
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema:
            type: string
            enum: [all, draft, scheduled, publishing, published, partially_published, failed, cancelled]
        - { name: provider, in: query, schema: { type: string, enum: [facebook, instagram] } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/PublicationList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
    post:
      summary: Créer un brouillon (rôle COMMUNITY_MANAGER minimum)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicationCreate' } } }
      responses:
        '201': { $ref: '#/components/responses/Publication' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/publications/counts:
    get:
      summary: Compter les publications par statut
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, schema: { type: string, format: uuid } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/publications/{publicationId}:
    parameters:
      - { name: publicationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Détail d'une publication
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Publication' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Modifier une publication non envoyée
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicationPatch' } } }
      responses:
        '200': { $ref: '#/components/responses/Publication' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Supprimer une publication (suppression logique)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Publication supprimée }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/publications/{publicationId}/schedule:
    parameters:
      - { name: publicationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Planifier l'envoi
      description: >
        `scheduledAt` est un instant absolu (ISO 8601 avec décalage), stocké en
        UTC. `timezone` sert uniquement à réafficher l'heure locale voulue.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/Publication' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      summary: Replanifier l'envoi
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Publication' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      summary: Annuler la planification (retour au brouillon)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Publication' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/publications/{publicationId}/publish:
    parameters:
      - { name: publicationId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string, maxLength: 200 }
        description: Rejoue la réponse mémorisée si la même commande est renvoyée.
    post:
      summary: Demander un envoi immédiat
      description: >
        Réponse `202` : l'envoi est exécuté par le worker. La publication passe
        en `publishing`, puis en `published`, `partially_published` ou `failed`.
      security: [{ bearerAuth: [] }]
      responses:
        '202': { $ref: '#/components/responses/PublishAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/publications/{publicationId}/retry:
    parameters:
      - { name: publicationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 200 } }
    post:
      summary: Relancer les réseaux en échec
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [facebook, instagram] }
      responses:
        '202': { $ref: '#/components/responses/PublishAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/calendar:
    get:
      summary: Publications planifiées ou publiées sur une période
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: brandId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/PublicationList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/social-accounts:
    get:
      summary: Lister les comptes sociaux liés à une marque (Sprint 06)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/social-accounts/{provider}/connect:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [facebook, instagram] } }
    post:
      summary: Démarrer (ou relancer) une connexion OAuth Meta ; provider=instagram non supporté avant le Sprint 07
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brandId, mobileRedirectUri]
              properties:
                brandId: { type: string, format: uuid }
                mobileRedirectUri: { type: string, description: 'Deep link Expo, ex. hootly://oauth/callback' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/social-accounts/oauth/status:
    get:
      summary: Statut d’un state OAuth émis par /connect (PENDING/COMPLETED/EXPIRED)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/social-accounts/{socialAccountId}:
    parameters:
      - { name: socialAccountId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Déconnecter un compte social (révoque côté Social ; ADMIN ou plus)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Déconnecté }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/social-accounts/{socialAccountId}/sync:
    parameters:
      - { name: socialAccountId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Revalider la connexion auprès de Meta (commentaires depuis le Sprint 08, voir /api/v1/comments/sync ; métriques depuis le Sprint 12, voir /api/v1/analytics/sync)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/comments:
    get:
      summary: Lister les commentaires d'une marque, paginé et filtré (Sprint 08, filtres IA au Sprint 09)
      description: >
        Les filtres d'analyse (sentiment/intention/priorité) portent sur la
        DERNIÈRE analyse du commentaire : un commentaire pas encore analysé
        n'en a aucune et sort donc des résultats dès qu'un de ces filtres est
        posé, plutôt que d'être rangé par défaut dans « neutre ».
        sort=priority classe HIGH d'abord, puis par date, les non analysés en
        dernier.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [new, processed, ignored, escalated, all] } }
        - { name: network, in: query, schema: { type: string, enum: [facebook, instagram] } }
        - { name: publicationId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: sentiment, in: query, schema: { type: string, enum: [positive, neutral, negative, all] } }
        - { name: intent, in: query, schema: { type: string, enum: [question, info_request, complaint, claim, other, all] } }
        - { name: priority, in: query, schema: { type: string, enum: [low, medium, high, all] } }
        - { name: sort, in: query, schema: { type: string, enum: [recent, priority], default: recent } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/comments/counts:
    get:
      summary: Compteurs de commentaires par marque (Sprint 08, highPriority réel depuis le Sprint 09)
      description: >
        highPriority compte les commentaires ENCORE À TRAITER dont la dernière
        analyse est « high ». pendingAiResponses vaut toujours 0 : rien ne
        persiste encore de proposition de réponse (Sprint 10) — ici 0 signifie
        « aucune », jamais « inconnu ».
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/comments/sync:
    post:
      summary: Synchroniser maintenant les commentaires d'une marque (Sprint 08)
      description: >
        Déclenche à la demande le même appel que le cron de secours toutes
        les 15 minutes (services/worker) — ne couvre que les posts publiés
        par Hootly (voir docs/SPRINT_08_WEBHOOKS_COMMENTAIRES_SYNCHRO.md).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [brandId], properties: { brandId: { type: string, format: uuid } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: Un compte a besoin d'être reconnecté }
  /api/v1/comments/{commentId}:
    parameters:
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Détail d'un commentaire (Sprint 08)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/comments/{commentId}/history:
    parameters:
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Historique d'un commentaire (Sprint 08, analyses depuis le Sprint 09)
      description: >
        Union de sources : comment_received, status_changed/escalated,
        send_failed/response_sent, et ai_analysis — une entrée par passage du
        modèle, « réanalyser » en ajoutant une sans effacer la précédente.
        Les genres response_proposed/response_edited n'apparaissent pas
        encore (Sprint 10) — pas une omission à corriger ici.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/comments/{commentId}/status:
    parameters:
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Changer le statut localement (Sprint 08, COMMUNITY_MANAGER ou plus)
      description: '"new" n''est jamais accepté : état système, jamais une action manuelle.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [processed, ignored, escalated] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/comments/{commentId}/escalate:
    parameters:
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Raccourci pour PATCH status=escalated (Sprint 08)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 1000 } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/comments/{commentId}/analyze:
    parameters:
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Analyser un commentaire (Sprint 09, COMMUNITY_MANAGER ou plus)
      description: >
        Synchrone : le modèle est linéaire (TF-IDF + régression logistique),
        pas un LLM, donc l'écran reçoit l'analyse directement. Renvoie le
        commentaire complet, analyse incluse. 400 si le commentaire n'a aucun
        texte (cas réel : un commentaire Meta réduit à une image).
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Service d'analyse injoignable ou modèles non entraînés (code ai_unavailable)
  /api/v1/comments/{commentId}/reanalyze:
    parameters:
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Réanalyser un commentaire (Sprint 09, COMMUNITY_MANAGER ou plus)
      description: >
        Même traitement que /analyze : les analyses sont empilées, jamais
        écrasées, donc réanalyser ajoute une entrée d'historique. Route
        distincte uniquement pour que l'audit distingue les deux intentions.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Service d'analyse injoignable ou modèles non entraînés (code ai_unavailable)
  /api/v1/comments/{commentId}/reply:
    parameters:
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Envoyer la réponse approuvée (Sprint 08, approbation obligatoire depuis le Sprint 10)
      description: >
        Le corps ne porte PLUS de texte depuis le Sprint 10 : le contenu publié
        est celui de la dernière proposition, qui doit être au statut
        `approved`. Accepter un texte libre ici viderait l'approbation de son
        sens — n'importe quel contenu aurait pu être publié derrière elle.
        409 si aucune proposition n'existe, si elle n'est pas approuvée, si la
        réponse a déjà été envoyée, ou si le commentaire a été supprimé sur la
        plateforme. Un échec marque la proposition `failed` plutôt que de la
        laisser « approuvée » : l'écran ne doit pas laisser croire qu'elle est
        partie. Idempotent par commentaire (clé dérivée côté serveur).
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/response-suggestions:
    post:
      summary: Générer ou rédiger une proposition de réponse (Sprint 10, COMMUNITY_MANAGER ou plus)
      description: >
        Sans `text`, la proposition est générée par le service IA à partir des
        paramètres de marque, de la publication liée et d'un historique borné
        à 5 échanges sur CE commentaire. Avec `text`, c'est le community
        manager qui a rédigé : la proposition est enregistrée telle quelle mais
        passe par le MÊME contrôle de sécurité — c'est par ce chemin qu'un
        engagement non autorisé arrive le plus souvent.
        Chaque appel crée une version : régénérer n'écrase jamais la
        proposition précédente.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commentId]
              properties:
                commentId: { type: string, format: uuid }
                text: { type: string, minLength: 1, maxLength: 500 }
                tone: { type: string, enum: [professional, friendly, empathetic, formal, custom] }
                language: { type: string, enum: [fr, en, ar] }
                instruction: { type: string, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Service IA injoignable (code ai_unavailable)
    get:
      summary: Lister toutes les versions d'une proposition (Sprint 10)
      description: Ordre croissant de version — l'historique complet, y compris les versions rejetées.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: commentId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/response-suggestions/{suggestionId}:
    parameters:
      - { name: suggestionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Détail d'une version (Sprint 10)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Enregistrer une réécriture humaine (Sprint 10, COMMUNITY_MANAGER ou plus)
      description: >
        Crée une NOUVELLE version plutôt que de modifier l'existante :
        `originalText` porte toujours la proposition d'origine de l'IA et n'est
        jamais réécrit. La version créée est marquée `generatedByAi: false` et
        repasse au contrôle de sécurité.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
                tone: { type: string, enum: [professional, friendly, empathetic, formal, custom] }
                language: { type: string, enum: [fr, en, ar] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/response-suggestions/{suggestionId}/approve:
    parameters:
      - { name: suggestionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Approuver une proposition (Sprint 10, COMMUNITY_MANAGER ou plus)
      description: >
        Seul chemin qui autorise ensuite un envoi. `text` permet d'approuver
        une ultime retouche en une requête : elle est enregistrée comme une
        version à part entière, recontrôlée, puis approuvée — le texte approuvé
        est donc exactement celui qui partira.
        409 quand le contrôle de sécurité signale un problème bloquant (terme
        interdit de la marque, engagement non autorisé, donnée personnelle en
        public, réponse trop longue), ou quand la proposition a déjà été
        envoyée ou rejetée.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/response-suggestions/{suggestionId}/reject:
    parameters:
      - { name: suggestionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Rejeter une proposition (Sprint 10, COMMUNITY_MANAGER ou plus)
      description: La version reste dans l'historique, elle n'est pas supprimée. 409 si déjà envoyée.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/publications/generate-hashtags:
    post:
      summary: Proposer des hashtags pour un texte de publication (Sprint 10)
      description: >
        Renvoie `hashtags` et `keywords` issus de la MÊME extraction : l'encart
        « mots-clés détectés » et les propositions de l'écran ne peuvent donc
        pas se contredire. `preserve` (la sélection déjà faite par
        l'utilisateur) revient en tête et n'est jamais évincée par le plafond
        de 15.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brandId, text]
              properties:
                brandId: { type: string, format: uuid }
                text: { type: string, minLength: 1, maxLength: 10000 }
                preserve: { type: array, maxItems: 30, items: { type: string, maxLength: 80 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Service IA injoignable (code ai_unavailable)
  /api/v1/notifications:
    get:
      summary: Lister les notifications de l'utilisateur connecté (Sprint 11)
      description: >
        Portée par l'utilisateur, jamais par la marque directement : une
        notification est créée une fois par destinataire (voir Jour 3), donc
        l'appartenance à `userId` EST le contrôle d'accès. `filter` reprend
        exactement la sémantique de `notificationsApi.list()` côté mobile
        (`all`, `unread`, `priority` = priorité haute, `errors` = échecs de
        publication/synchronisation/token).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, unread, priority, errors], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/notifications/unread-count:
    get:
      summary: Compteur de notifications non lues (Sprint 11)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/notifications/{notificationId}/read:
    parameters:
      - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Marquer une notification comme lue (Sprint 11)
      description: Idempotent — relire une notification déjà lue ne change pas son horodatage de lecture.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/notifications/read-all:
    post:
      summary: Marquer toutes les notifications non lues comme lues (Sprint 11)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/device-tokens:
    post:
      summary: Enregistrer ou renouveler un token FCM pour l'appareil courant (Sprint 11)
      description: >
        Upsert par `token` (unique globalement) : un appareil réinstallé ou
        reconnecté sous un autre compte réassigne la même ligne au nouvel
        utilisateur. Aussi utilisé quand Firebase renouvelle le token
        (nouvel appel avec la nouvelle valeur).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, minLength: 1, maxLength: 400 }
                platform: { type: string, enum: [android, ios] }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
    delete:
      summary: Désassocier un token FCM, p. ex. à la déconnexion (Sprint 11)
      description: Le token voyage dans le corps, pas dans l'URL. Silencieux si le token n'existe déjà plus.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 1, maxLength: 400 }
      responses:
        '204': { description: Token désassocié (ou déjà absent) }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/notification-settings:
    get:
      summary: Lire les préférences de notification (Sprint 11)
      description: Valeurs par défaut renvoyées si l'utilisateur n'a encore rien réglé — aucune ligne n'est créée par une lecture.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
    patch:
      summary: Modifier les préférences de notification (Sprint 11)
      description: Upsert — crée la ligne au besoin. Vérifiées côté serveur avant tout envoi push (Jour 3), jamais côté client seul.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettingsPatch' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/v1/analytics/sync:
    post:
      summary: Déclencher une synchronisation des métriques pour une marque (Sprint 12)
      description: >
        Empile un job sur la même file que le cron du worker et répond 202
        immédiatement — n'appelle jamais graph-api de façon synchrone, donc ne
        peut jamais bloquer la requête ni être le déclencheur d'une
        synchronisation lourde depuis un simple affichage. Déduplication
        (fenêtre de 60s) par marque : un double clic ne fait pas partir deux
        balayages (data.queued vaut false pour le second appel).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [brandId], properties: { brandId: { type: string, format: uuid } } }
      responses:
        '202': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/analytics/summary:
    get:
      summary: Totaux et deltas pour une marque sur une période (Sprint 12)
      description: >
        null et 0 sont distincts : null signifie que Meta n'a pas renvoyé la
        métrique pour le dernier relevé (permission manquante, erreur
        transitoire), jamais coercé à zéro. engagementRate =
        (reactions+comments+shares)/reach, null si reach est null ou 0.
        unavailable liste les réseaux dont une permission de lecture des
        métriques a été explicitement refusée — pas ceux simplement pas
        encore synchronisés.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d, 90d], default: 30d } }
        - { name: network, in: query, schema: { type: string, enum: [facebook, instagram, all], default: all } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/analytics/timeline:
    get:
      summary: Interactions par réseau, 4 semaines glissantes fixes (Sprint 12)
      description: >
        Fenêtre fixée à 4 semaines glissantes quel que soit le contexte —
        n'accepte pas de paramètre period, contrairement aux autres routes de
        ce domaine, pour rester cohérente avec le titre statique affiché par
        l'écran mobile. Un relevé null contribue pour 0 à une barre
        hebdomadaire (somme sur plusieurs publications), contrairement à une
        carte métrique individuelle.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: network, in: query, schema: { type: string, enum: [facebook, instagram, all], default: all } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/analytics/top-publications:
    get:
      summary: Publications les plus engageantes de la période (Sprint 12)
      description: Classées par (reactions+comments+shares) décroissant ; sérialisées comme n'importe quelle Publication (mêmes champs metrics/commentCount que /api/v1/publications).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d, 90d], default: 30d } }
        - { name: network, in: query, schema: { type: string, enum: [facebook, instagram, all], default: all } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/analytics/networks-comparison:
    get:
      summary: Mêmes totaux que /summary, ventilés par réseau (Sprint 12)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d, 90d], default: 30d } }
        - { name: network, in: query, schema: { type: string, enum: [facebook, instagram, all], default: all } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/analytics/sentiments:
    get:
      summary: Répartition des commentaires par sentiment sur la période (Sprint 12)
      description: Compte uniquement la DERNIÈRE analyse de chaque commentaire (comme /api/v1/comments) — un commentaire jamais analysé n'est compté nulle part, jamais rangé par défaut dans « neutre ».
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d, 90d], default: 30d } }
        - { name: network, in: query, schema: { type: string, enum: [facebook, instagram, all], default: all } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/analytics/priorities:
    get:
      summary: Répartition des commentaires par priorité sur la période (Sprint 12)
      description: Même règle que /api/v1/analytics/sentiments — dernière analyse uniquement.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d, 90d], default: 30d } }
        - { name: network, in: query, schema: { type: string, enum: [facebook, instagram, all], default: all } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/analytics/publications/{publicationId}:
    parameters:
      - { name: publicationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Détail analytics d'une publication (Sprint 12)
      description: >
        404 (jamais 403) si la publication n'appartient pas à la marque
        indiquée par ?brandId=, même convention que le reste de l'API.
        unavailable ne liste que les réseaux dont la permission de lecture
        des métriques a été explicitement refusée — pas ceux simplement pas
        encore synchronisés.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/dashboard/summary:
    get:
      summary: Compteurs agrégés pour l'écran d'accueil (Sprint 12)
      description: Recompose comments/service.js::commentsCounts et un comptage de publications planifiées — aucune nouvelle requête d'agrégation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/dashboard/priority-comments:
    get:
      summary: Les 3 commentaires prioritaires non traités (Sprint 12)
      description: Recompose comments/service.js::listComments(status=new, priority=high, sort=priority).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/dashboard/upcoming-publications:
    get:
      summary: Les 3 prochaines publications planifiées (Sprint 12)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PublicationTargetInput:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [facebook, instagram] }
        socialAccountId:
          type: [string, 'null']
          format: uuid
          description: Renseigné à partir du Sprint 06 (comptes liés par OAuth).
        adaptedContent: { type: [string, 'null'], maxLength: 5000 }
        adaptedHashtags: { type: array, items: { type: string }, maxItems: 30 }
    PublicationCreate:
      type: object
      required: [brandId, content]
      properties:
        brandId: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 5000 }
        language: { type: string, enum: [fr, en, ar], default: fr }
        hashtags: { type: array, items: { type: string }, maxItems: 30 }
        mediaIds:
          type: array
          items: { type: string, format: uuid }
          maxItems: 1
          description: Une image par publication dans le MVP (ADR-08).
        targets: { type: array, items: { $ref: '#/components/schemas/PublicationTargetInput' }, maxItems: 2 }
        timezone: { type: string, default: Europe/Paris }
    PublicationPatch:
      type: object
      minProperties: 1
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }
        language: { type: string, enum: [fr, en, ar] }
        hashtags: { type: array, items: { type: string }, maxItems: 30 }
        mediaIds: { type: array, items: { type: string, format: uuid }, maxItems: 1 }
        targets: { type: array, items: { $ref: '#/components/schemas/PublicationTargetInput' }, maxItems: 2 }
        timezone: { type: string }
    ScheduleRequest:
      type: object
      required: [scheduledAt]
      properties:
        scheduledAt: { type: string, format: date-time }
        timezone: { type: string, example: Europe/Paris }
    Publication:
      type: object
      properties:
        id: { type: string, format: uuid }
        brandId: { type: string, format: uuid }
        brandName: { type: string }
        content: { type: string }
        language: { type: string }
        hashtags: { type: array, items: { type: string } }
        status:
          type: string
          enum: [draft, scheduled, publishing, published, partially_published, failed, cancelled]
        media: { type: array, items: { $ref: '#/components/schemas/Media' } }
        targets:
          type: array
          items:
            type: object
            properties:
              provider: { type: string, enum: [facebook, instagram] }
              status: { type: string, enum: [pending, sending, sent, failed] }
              externalPublicationId: { type: [string, 'null'] }
              lastErrorCode: { type: [string, 'null'] }
              lastErrorMessage: { type: [string, 'null'] }
              attemptCount: { type: integer }
              sentAt: { type: [string, 'null'], format: date-time }
        scheduledAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        metrics:
          type: object
          description: Toujours nul avant le Sprint 12 ; « non disponible » n'est jamais 0.
        commentCount: { type: integer }
    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        status: { type: string, enum: [TEMPORARY, READY, DELETED] }
        previewUrl: { type: string, description: URL signée à durée de vie courte }
        expiresAt: { type: string, format: date-time }
    ProfilePatch:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 2, maxLength: 80 }
        lastName: { type: string, minLength: 2, maxLength: 80 }
        displayName: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 30 }
        language: { type: string, enum: [fr, en, ar] }
        timezone: { type: string, example: Indian/Antananarivo }
    PreferencesPatch:
      type: object
      minProperties: 1
      properties:
        weeklyDigest: { type: boolean }
        pushNotifications: { type: boolean }
        weekStartsOn: { type: string, enum: [monday, sunday] }
    NotificationSettingsPatch:
      type: object
      minProperties: 1
      description: >
        Un bouton par type de notification (Sprint 11), aligné sur
        NotificationPreferences côté mobile. `minimumPriority` filtre
        indépendamment des bascules par type.
      properties:
        negativeComment: { type: boolean }
        urgentComment: { type: boolean }
        highPriorityComment: { type: boolean }
        aiResponseGenerated: { type: boolean }
        publicationPublished: { type: boolean }
        publicationFailed: { type: boolean }
        tokenExpiring: { type: boolean }
        syncFailed: { type: boolean }
        sound: { type: boolean }
        vibration: { type: boolean }
        quietHoursStart: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '22:00' }
        quietHoursEnd: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '07:00' }
        minimumPriority: { type: string, enum: [low, medium, high] }
    AvatarMetadata:
      type: object
      required: [objectKey, mimeType, sizeBytes]
      properties:
        bucket: { type: string, default: hootly }
        objectKey: { type: string, example: 'avatars/{userId}/avatar.webp' }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        checksum: { type: string, description: SHA-256 hex digest }
    BrandCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 5000 }
        industry: { type: [string, 'null'], maxLength: 100 }
        primaryLanguage: { type: string, enum: [fr, en, ar], default: fr }
    BrandPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 5000 }
        industry: { type: [string, 'null'], maxLength: 100 }
        primaryLanguage: { type: string, enum: [fr, en, ar] }
    AiSettingsPatch:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1, description: Version lue avant la modification }
        tone: { type: string, enum: [professional, friendly, empathetic, formal, custom] }
        customTone: { type: [string, 'null'], maxLength: 5000 }
        formality: { type: string, enum: [informal, formal, adaptive] }
        language: { type: string, enum: [fr, en, ar] }
        emojisAllowed: { type: boolean }
        targetLength: { type: string, enum: ['1 phrase', '2 phrases', '3 phrases', Libre] }
        greeting: { type: [string, 'null'], maxLength: 300 }
        closing: { type: [string, 'null'], maxLength: 300 }
        forbiddenTerms: { type: array, maxItems: 100, items: { type: string, maxLength: 120 } }
        recommendedTerms: { type: array, maxItems: 100, items: { type: string, maxLength: 120 } }
        instructions: { type: [string, 'null'], maxLength: 10000 }
        complaintInstructions: { type: [string, 'null'], maxLength: 10000 }
        urgencyInstructions: { type: [string, 'null'], maxLength: 10000 }
        supportInstructions: { type: [string, 'null'], maxLength: 10000 }
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        language: { type: string, enum: [fr, en, ar], default: fr }
        timezone: { type: string, example: Europe/Paris }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 20 }
        password: { type: string, format: password, minLength: 8 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8 }
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }
    DeviceSession:
      type: object
      required: [id, device, lastActiveAt, current]
      properties:
        id: { type: string, format: uuid }
        device: { type: string }
        lastActiveAt: { type: string, format: date-time }
        current: { type: boolean }
    SessionData:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, minimum: 1 }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, firstName, lastName, language, timezone]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        language: { type: string, enum: [fr, en, ar] }
        timezone: { type: string }
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          type: object
          required: [requestId]
          properties:
            requestId: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: array, items: { type: object } }
  responses:
    Publication:
      description: Publication sous enveloppe Hootly
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Publication' }
    PublicationList:
      description: Liste paginée de publications
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Publication' } }
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
    Media:
      description: Média et URL signée
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Media' }
    PublishAccepted:
      description: Commande acceptée ; l'envoi est exécuté par le worker
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      jobId: { type: [string, 'null'] }
                      publication: { $ref: '#/components/schemas/Publication' }
    Unprocessable:
      description: Règle métier non satisfaite
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    MediaTooLarge:
      description: Fichier au-delà de la taille autorisée (media_too_large)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    MediaTypeNotAllowed:
      description: Format refusé (media_type_not_allowed)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Success:
      description: RÃ©ponse rÃ©ussie sous enveloppe Hootly
      content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
    Session:
      description: Tokens rotatifs et utilisateur authentifié
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/SessionData' }
    CurrentUser:
      description: Utilisateur authentifié
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    SessionList:
      description: Sessions actives de l’utilisateur connecté
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DeviceSession' } }
    ValidationFailed:
      description: Entrée invalide
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    AuthenticationRequired:
      description: Authentification invalide ou absente
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Ressource déjà existante ou état incompatible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: RÃ´le insuffisant pour l’opÃ©ration demandÃ©e
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Ressource introuvable ou non accessible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: Limite de requêtes atteinte
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: Service non prêt
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
